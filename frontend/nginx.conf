server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Reverse proxy API requests to the api container
    location /api/ {
        proxy_pass http://api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Serve static files, fall back to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html carries SSI includes for the installation's custom HTML
    # hooks (head.html, body-end.html). Every SPA route lands here through
    # the try_files fallback above. A hook file that does not exist is
    # silently replaced with nothing, so a deployment with no custom folder
    # renders exactly as before.
    location = /index.html {
        ssi on;
        ssi_silent_errors on;
    }

    # Where those includes are read from: mount a folder here to use them.
    # internal: reachable only through the includes, never by a browser.
    location /_custom/ {
        internal;
        alias /etc/sky-history/custom/;
        log_not_found off;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
